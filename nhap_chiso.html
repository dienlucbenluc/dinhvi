<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ghi Chỉ Số Điện Năng</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f9; color: #333; padding-bottom: 20px; }

    /* Header */
    .header {
      background: #0056b3; color: white; padding: 12px 15px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .header h2 { font-size: 16px; margin: 0; }
    .header-user { font-size: 13px; display: flex; align-items: center; gap: 8px; }

    /* Summary & Action Bar */
    .summary-bar {
      background: white; padding: 10px 15px; border-bottom: 1px solid #ddd;
      display: flex; justify-content: space-around; align-items: center; font-size: 13px;
    }
    .summary-item { text-align: center; cursor: pointer; }
    .summary-item b { display: block; font-size: 16px; color: #0056b3; }

    .sync-bar {
      background: #e9ecef; padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; border-bottom: 1px solid #ccc;
    }
    .btn-sync {
      background: #28a745; color: white; border: none; padding: 5px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px;
    }
    .btn-sync:active { background: #218838; }

    /* Search Box */
    .search-box { padding: 10px 15px; background: white; display: flex; gap: 8px; border-bottom: 1px solid #eee; }
    .search-box input {
      flex: 1; padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; outline: none;
    }
    .search-box button {
      background: #0056b3; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer;
    }

    /* Container & Card Sliders */
    .container { padding: 12px; position: relative; overflow: hidden; min-height: 420px; }
    
    .customer-card {
      background: white; border-radius: 8px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.25s ease-out, opacity 0.25s ease-out; position: relative; width: 100%;
    }

    /* Animation classes */
    .slide-left-out { transform: translateX(-100%); opacity: 0; }
    .slide-left-in { animation: slideLeftIn 0.25s forwards; }
    .slide-right-out { transform: translateX(100%); opacity: 0; }
    .slide-right-in { animation: slideRightIn 0.25s forwards; }

    @keyframes slideLeftIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes slideRightIn {
      from { transform: translateX(-100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* Customer Info Header */
    .cust-header { border-bottom: 1px dashed #ccc; padding-bottom: 8px; margin-bottom: 8px; }
    .cust-title { font-size: 15px; color: #0056b3; margin-bottom: 3px; }
    .cust-tenKH { font-size: 16px; font-weight: bold; color: #111; margin-bottom: 3px; }
    .cust-address { font-size: 13px; color: #555; margin-bottom: 3px; line-height: 1.3; }
    .cust-row-group { font-size: 12px; color: #444; margin-top: 4px; }
    
    .input-ghichu {
      width: 100%; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; margin-top: 4px; outline: none;
    }
    .box-maps { margin-top: 6px; font-size: 13px; }

    .cust-dynamic-info-v2 {
      background: #eef5fc; padding: 6px 10px; border-radius: 4px; margin-top: 6px;
      display: flex; justify-content: space-between; font-size: 12px; color: #333;
    }

    /* Table Styles */
    .table-responsive { width: 100%; overflow-x: auto; margin-top: 8px; }
    .chiso-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .chiso-table th { background: #f0f4f8; border: 1px solid #ddd; padding: 6px 4px; text-align: center; color: #333; }
    .chiso-table td { border: 1px solid #ddd; padding: 4px; vertical-align: middle; }
    
    .bcs-badge { background: #e0e0e0; padding: 2px 6px; border-radius: 3px; font-weight: bold; font-size: 12px; }
    .input-cs-moi {
      width: 100%; padding: 6px; border: 1px solid #007bff; border-radius: 4px;
      font-size: 15px; font-weight: bold; text-align: right; color: #000; outline: none; background: #fffbe6;
    }
    .val-calc-large { font-weight: bold; font-size: 14px; }
    .text-center { text-align: center; }
    .text-right { text-align: right; }

    /* Button Group */
    .card-btn-group { display: flex; gap: 10px; margin-top: 12px; }
    .btn-card {
      flex: 1; padding: 10px; border: none; border-radius: 4px; font-weight: bold; font-size: 14px; cursor: pointer; color: white;
    }
    .btn-card-save { background: #28a745; }
    .btn-card-cancel { background: #dc3545; }
    .btn-card:disabled { background: #ccc; cursor: not-allowed; }

    /* Toast Notice */
    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.85); color: white; padding: 10px 18px; border-radius: 20px;
      font-size: 13px; display: none; z-index: 9999; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* Modal Confirm */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 10000;
    }
    .modal-box {
      background: white; padding: 20px; border-radius: 8px; width: 85%; max-width: 320px; text-align: center;
    }
    .modal-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; color: #333; }
    .modal-msg { font-size: 14px; color: #555; margin-bottom: 18px; white-space: pre-line; text-align: left; }
    .modal-btns { display: flex; gap: 10px; justify-content: center; }
    .btn-modal { padding: 8px 16px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; }
    .btn-modal-cancel { background: #6c757d; }
    .btn-modal-confirm { background: #28a745; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h2>GHI CHỈ SỐ ĐIỆN NĂNG</h2>
    <div class="header-user">
      <span id="userDisplay">👷 --</span>
    </div>
  </div>

  <!-- Summary Bar -->
  <div class="summary-bar">
    <div class="summary-item" onclick="showAllData()">
      Tổng KH
      <b id="sumTongKh">0</b>
    </div>
    <div class="summary-item" onclick="filterDaCS()">
      Đã ghi
      <b id="sumDaCS" style="color:#28a745;">0</b>
    </div>
    <div class="summary-item" onclick="filterChuaGhi()">
      Chưa ghi
      <b id="sumChuaGhi" style="color:#dc3545;">0</b>
    </div>
  </div>

  <!-- Sync Bar (Quản lý File Text Cục bộ) -->
  <div class="sync-bar">
    <span id="txtFileStatus">📁 File text local: <b>0</b> bản ghi chờ đẩy</span>
    <button class="btn-sync" onclick="syncLocalTextFilesToSheet()">🔄 Đồng bộ ngay</button>
  </div>

  <!-- Search Box -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Tìm tên, mã KH, số cột, trạm, SĐT..." onkeyup="if(event.key === 'Enter') filterData()">
    <button onclick="filterData()">Tìm</button>
  </div>

  <!-- Main Customer Card Container -->
  <div class="container" id="listContainer">
    <p style="text-align: center; padding-top: 30px; font-weight: bold; color: #666;">⏳ Đang tải dữ liệu...</p>
  </div>

  <!-- Toast Notice -->
  <div id="toast"></div>

  <!-- Custom Confirm Modal -->
  <div class="modal-overlay" id="customConfirmModal">
    <div class="modal-box">
      <div class="modal-title" id="confirmModalTitle">XÁC NHẬN</div>
      <div class="modal-msg" id="confirmModalMessage">Nội dung thông báo...</div>
      <div class="modal-btns">
        <button class="btn-modal btn-modal-cancel" id="btnModalCancel">HỦY BỎ</button>
        <button class="btn-modal btn-modal-confirm" id="btnModalConfirm">ĐỒNG Ý</button>
      </div>
    </div>
  </div>

  <!-- Link tới file Javascript đã chỉnh sửa -->
  <script src="nhap_chiso.js"></script>
</body>
</html>
