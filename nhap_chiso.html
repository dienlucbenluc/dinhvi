<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nhập chỉ số khách hàng</title>
  <!-- Thư viện SheetJS đọc/ghi file Excel trực tiếp tại Client -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0 auto; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background: #f0f2f5; 
      color: #333; 
      overflow: hidden; 
      max-width: 480px;
      position: relative;
      box-shadow: 0 0 20px rgba(0,0,0,0.15);
    }
    
    .sticky-top-container {
      position: absolute;
      top: 0; left: 0; right: 0;
      background: #fff;
      z-index: 1000;
      padding: 8px 10px 6px 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    
    .btn-action-hdr { 
      background: #eef5fc; color: #006400; border: 1px solid #c3e6cb; border-radius: 4px; height:32px; padding:0 8px; font-size:13px; font-weight:bold; cursor:pointer; display:flex; align-items:center; gap:3px;
    }
    .btn-action-hdr:active { opacity: 0.8; }
    .btn-send-hdr { background: #fdf2f2; color: #800000; border-color: #f5c6cb; }
    .btn-menu { 
      background: #fff; border: 1px solid #ccc; color:#000; height:32px; padding:0 8px; font-size:13px; font-weight:bold; flex-shrink:0; border-radius:4px; cursor:pointer;
    }
    .btn-menu:active { background: #e2e6ea; }
    
    .search-box { display: flex; gap: 6px; margin-bottom: 6px; }
    .search-box input { 
      flex: 1; padding: 6px 10px; border-radius: 5px; border: 1px solid #ccc; font-size: 14px; outline: none; 
    }
    .search-box input:focus { border-color: #0056b3; }
    .btn-search {
      background: #0056b3; color: #fff; border: none; border-radius: 5px; padding: 0 12px; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .btn-search:active { background: #004085; }
    
    .summary-bar {
      display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; background: #eef5fc; border-radius: 5px; font-size: 13px; color: #004085; font-weight: 600; line-height: 1.2;
    }
    .summary-bar span { white-space: nowrap; }
    .link-filter-action { color: #0056b3; text-decoration: none; cursor: pointer; font-weight: bold; }
    .link-filter-chuaghi { color: #d9534f; text-decoration: none; cursor: pointer; font-weight: bold; }
    
    #listContainer {
      position: absolute; top: 120px; bottom: 0; left: 0; right: 0; padding: 8px 10px; overflow-y: auto; touch-action: pan-y;
    }
    
    .customer-card { 
      background: #fff; border-radius: 8px; padding: 10px; border: 1.5px solid #0056b3; box-shadow: 0 4px 10px rgba(0,0,0,0.08); user-select: none; transition: transform 0.2s ease-out, opacity 0.2s ease-out;
    }
    .slide-left-out { transform: translateX(-120%); opacity: 0; }
    .slide-right-out { transform: translateX(120%); opacity: 0; }
    .slide-left-in { transform: translateX(100%); opacity: 0; }
    .slide-right-in { transform: translateX(-100%); opacity: 0; }
    
    .cust-header { padding-bottom: 4px; }
    .cust-title { font-weight: bold; color: #0056b3; font-size: 14px; line-height: 1.3; }
    .cust-tenKH { font-weight: bold; color: #0056b3; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cust-address { font-size: 13px; color: #222; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .cust-row-group { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; align-items: center; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .input-ghichu { width: 100%; border: none; border-bottom: 1px solid #007bff; outline: none; padding: 4px 0; margin-top: 4px; font-size: 13px; background-color: #fff; }
    .input-ghichu:focus { border-color: #8B0000; }
    
    .box-maps { padding: 5px; font-size: 13px; background: #f8f9fa; border-radius: 4px; border: 1px solid #e9ecef; text-align: center; margin-top: 6px; }
    
    .cust-dynamic-info-v2 { background: #eef5fc; padding: 6px; border-radius: 4px; font-size: 12px; color: #004085; font-weight: bold; margin-top: 6px; display: flex; justify-content: space-between; align-items: center; }
    
    .table-responsive { overflow-x: auto; margin-top: 8px; }
    table.chiso-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.chiso-table th { background: #e9ecef; color: #111; padding: 6px 2px; border: 1px solid #ccc; font-size: 12px; font-weight: bold; text-align: center; }
    table.chiso-table td { font-size: 14px; border: 1px solid #ddd; vertical-align: middle; padding: 2px; }
    .text-right { text-align: right !important; padding-right: 4px; }
    .text-center { text-align: center !important; }
    .val-calc-large { font-size: 15px !important; font-weight: bold !important; color: #111; }
    .bcs-badge { font-weight: bold; color: #111; font-size: 12px; }
    
    input.input-cs-moi { width: 100%; height: 32px; padding: 2px 4px; background-color: #F0FFFF; border: 1px solid #b8daff; border-radius: 3px; text-align: right; font-weight: bold; font-size: 16px; color: #0056b3; outline: none; }
    input.input-cs-moi:focus { background-color: #ffffff; border: 2px solid #007bff; }
    select.select-loai { width: 100%; height: 32px; font-weight: bold; font-size: 13px; color: #0056b3; border: 1px solid #ccc; border-radius: 3px; background: #fff; outline: none; text-align: center; }
    
    .card-btn-group { display: flex; gap: 8px; margin-top: 10px; padding-top: 8px; border-top: 1px dashed #28a745; }
    .btn-card { height: 34px; flex: 1; border: none; border-radius: 4px; font-weight: bold; font-size: 13px; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; }
    .btn-card-save { background: #28a745; }
    .btn-card-save:disabled { background: #a5d6a7; cursor: not-allowed; opacity: 0.6; }
    .btn-card-cancel { background: #dc3545; }
    .btn-card-cancel:disabled { background: #ef9a9a; cursor: not-allowed; opacity: 0.6; }

    /* Modal xịn bo góc */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.4); display: none; align-items: center; justify-content: center; z-index: 10000; }
    .modal-box { background: #ffffff; width: 88%; max-width: 360px; border-radius: 10px; padding: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .modal-title { font-size: 15px; font-weight: bold; color: #007bff; margin-bottom: 8px; text-align: center; }
    .modal-message { font-size: 13px; color: #333; line-height: 1.4; white-space: pre-line; }
    .modal-buttons { display: flex; gap: 8px; margin-top: 14px; }
    .modal-buttons button { flex: 1; padding: 8px; font-size: 13px; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; }
    .btn-modal-cancel { background: #e0e0e0; color: #333; }
    .btn-modal-confirm { background: #28a745; color: white; }

    /* Toast chuẩn floating */
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 16px;
      background: #006400;
      color: #fff;
      font-size: 13px;
      line-height: 1.4;
      z-index: 10001;
      border-radius: 20px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 85%;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      pointer-events: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    #toast.error { background: #b71c1c; }
    #toast.show { visibility: visible; opacity: 1; }
    
    .spinner {
      width: 20px; height: 20px; border: 3px solid #f3f3f3; border-top: 3px solid #007bff; border-radius: 50%; display: inline-block; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="sticky-top-container">
    <div class="header">
        <button class="btn-menu" onclick="window.location.href='home.html'">🏠 Trang chủ</button>        
        <button class="btn-action-hdr" onclick="handleFetchDataBtn()">📥 Lấy sổ GCS</button>
        <button class="btn-action-hdr btn-send-hdr" onclick="handleSendDataBtn()">📤 Trả sổ GCS</button>
    </div>
    
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Mã, Tên, Đ/C, Cột, Trạm, Sổ..." onkeydown="if(event.key==='Enter') filterData();">
      <button class="btn-search" onclick="filterData()">🔍 Tìm</button>
    </div>
    
    <div class="summary-bar">
      <span><button onclick="downloadAllExcelFiles()" title="Tải file Excel cục bộ" style="background: transparent; border: none; cursor: pointer; font-size: 14px; padding: 0;">📊</button></span>
      <span>Tổng: <b id="sumTongKh">0</b></span>
      <span style="display: none;" onclick="filterDaCS()">Đã ghi: <b id="sumDaCS" style="color:#28a745;">0</b></span>
      <span style="cursor:pointer;" onclick="filterChuaGhi()">Chưa ghi: <b id="sumChuaGhi" style="color:#d9534f;">0</b></span>
      <span class="link-filter-chuaghi" onclick="filterChuaGhi()">🔍 Chưa ghi</span>
      <span class="link-filter-action" onclick="showAllData()">🔍 Tất cả</span>      
    </div>
  </div>

  <div id="listContainer">
    <div style="text-align: center; padding-top: 40px;">
      <span class="spinner"></span>
      <span style="font-weight: bold; color: #007bff; vertical-align: middle;">Đang lấy danh sách...</span>
    </div>
  </div>

  <div id="toast"></div>

  <div id="customConfirmModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title" id="confirmModalTitle">XÁC NHẬN</div>
      <div class="modal-message" id="confirmModalMessage">Nội dung thông báo...</div>
      <div class="modal-buttons">
        <button class="btn-modal-cancel" id="btnModalCancel">Hủy</button>
        <button class="btn-modal-confirm" id="btnModalConfirm">Xác nhận</button>
      </div>
    </div>
  </div>

  <script src="nhap_chiso.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW reg error: ', err));
      });
    }
  </script>
</body>
</html>
