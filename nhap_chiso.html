<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nhập Chỉ Số Công Tơ</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding-bottom: 70px; }
    .header-bar { background: linear-gradient(135deg, #0d6efd, #0a58ca); color: white; padding: 15px; border-bottom-left-radius: 15px; border-bottom-right-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .card-customer { border-radius: 12px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 15px; transition: transform 0.2s; }
    .card-customer.done { border-left: 5px solid #198754; }
    .card-customer.pending { border-left: 5px solid #ffc107; }
    .badge-status { font-size: 0.8rem; padding: 5px 10px; border-radius: 8px; }
    .btn-gps { border-radius: 8px; font-weight: 600; }
    .sticky-search { position: sticky; top: 0; z-index: 1000; background: #f4f6f9; padding-top: 10px; padding-bottom: 10px; }
    .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 9999; display: flex; justify-content: center; align-items: center; flex-direction: column; }
  </style>
</head>
<body>

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay d-none">
    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
    <span class="mt-2 fw-bold text-dark" id="loadingText">Đang tải dữ liệu...</span>
  </div>

  <!-- Header -->
  <div class="header-bar text-center">
    <h5 class="mb-1 fw-bold"><i class="fa-solid fa-gauge-high me-2"></i>NHẬP CHỈ SỐ CÔNG TƠ</h5>
    <div class="d-flex justify-content-between align-items-center mt-2 px-2">
      <small id="userDisplay"><i class="fa-solid fa-user me-1"></i>--</small>
      <button class="btn btn-sm btn-light text-primary fw-bold" onclick="loadChiSoData()"><i class="fa-solid fa-rotate me-1"></i>Làm mới</button>
    </div>
  </div>

  <div class="container mt-2">
    <!-- Tìm kiếm & Bộ lọc -->
    <div class="sticky-search">
      <div class="row g-2">
        <div class="col-7">
          <input type="text" id="searchInput" class="form-control" placeholder="Tìm tên, Mã KH, Số CT..." oninput="filterData()">
        </div>
        <div class="col-5">
          <select id="filterStatus" class="form-select" onchange="filterData()">
            <option value="ALL">Tất cả</option>
            <option value="CHUA_CS" selected>Chưa nhập</option>
            <option value="CO_CS">Đã nhập</option>
          </select>
        </div>
      </div>
      <div class="d-flex justify-content-between align-items-center mt-2 px-1 text-muted small">
        <span>Tổng số: <strong id="txtTotal">0</strong></span>
        <span>Đã ghi: <strong id="txtDone" class="text-success">0</strong></span>
        <span>Chưa ghi: <strong id="txtPending" class="text-warning">0</strong></span>
      </div>
    </div>

    <!-- Danh sách khách hàng -->
    <div id="customerList" class="mt-2"></div>
  </div>

  <!-- Modal Chỉnh Sửa / Nhập Chỉ Số -->
  <div class="modal fade" id="modalNhapChiSo" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h6 class="modal-title fw-bold" id="modalTitle">Nhập chỉ số</h6>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="formChiSo">
            <input type="hidden" id="modalRowIndex">
            
            <div class="mb-2">
              <label class="fw-bold text-primary mb-0" id="modalTenKhang">Tên khách hàng</label>
              <div class="text-muted small" id="modalMaKhCto">Mã KH - Số CTơ</div>
              <div class="text-muted small" id="modalDiaChi"><i class="fa-solid fa-location-dot me-1"></i>Địa chỉ</div>
            </div>
            <hr class="my-2">

            <div class="row g-2 mb-2">
              <div class="col-6">
                <label class="form-label small mb-1">CS Cũ</label>
                <input type="number" id="modalCSCu" class="form-control bg-light" readonly>
              </div>
              <div class="col-6">
                <label class="form-label small mb-1 fw-bold text-danger">CS Mới (*)</label>
                <input type="number" id="modalCSMoi" class="form-control fw-bold fs-5 text-primary" placeholder="0" oninput="tinhSanLuong()">
              </div>
            </div>

            <div class="row g-2 mb-2">
              <div class="col-6">
                <label class="form-label small mb-1">HSN</label>
                <input type="number" id="modalHSN" class="form-control bg-light" value="1" readonly>
              </div>
              <div class="col-6">
                <label class="form-label small mb-1">Sản lượng (kWh)</label>
                <input type="number" id="modalSanLuong" class="form-control bg-light fw-bold" readonly>
              </div>
            </div>

            <div class="mb-2">
              <label class="form-label small mb-1">Tọa độ hiện tại (GPS)</label>
              <div class="input-group">
                <input type="text" id="modalToaDo" class="form-control small bg-light" placeholder="Chưa lấy tọa độ" readonly>
                <button class="btn btn-outline-primary btn-gps" type="button" onclick="layToaDoGPS()">
                  <i class="fa-solid fa-crosshairs"></i> Vị trí
                </button>
              </div>
              <small id="gpsStatus" class="text-muted" style="font-size: 0.75rem;"></small>
            </div>

            <div class="mb-2">
              <label class="form-label small mb-1">Ghi chú</label>
              <textarea id="modalGhiChu" class="form-control" rows="2" placeholder="Nhập ghi chú (nếu có)..."></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer d-flex justify-content-between">
          <button type="button" class="btn btn-outline-danger btn-sm" onclick="xoaChiSo()"><i class="fa-solid fa-trash me-1"></i>Xóa CS</button>
          <div>
            <button type="button" class="btn btn-secondary btn-sm me-1" data-bs-dismiss="modal">Hủy</button>
            <button type="button" class="btn btn-primary btn-sm px-3" onclick="luuChiSo()"><i class="fa-solid fa-floppy-disk me-1"></i>Lưu</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="nhap_chiso.js"></script>
</body>
</html>
