<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Nhập Liệu A_TAM</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f6f9; }
        .form-container { max-width: 400px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        #responseMsg { margin-top: 15px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

<div class="form-container">
    <h3>Nhập Dữ Liệu Bảng A_TAM</h3>
    <form id="dataForm">
        <div class="form-group">
            <label for="colA">Giá trị cột A:</label>
            <input type="text" id="colA" name="colA" required>
        </div>
        <div class="form-group">
            <label for="colB">Giá trị cột B:</label>
            <input type="text" id="colB" name="colB" required>
        </div>
        <button type="submit">Lưu Dữ Liệu</button>
    </form>
    <div id="responseMsg"></div>
</div>

<script>
document.getElementById('dataForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    const msgDiv = document.getElementById('responseMsg');
    msgDiv.style.color = '#333';
    msgDiv.innerText = 'Đang xử lý...';

    fetch('http://10.183.45.1/htcmis/php/test/xuly_nhap.php', {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if(data.status === 'success') {
            msgDiv.style.color = 'green';
            msgDiv.innerText = data.message;
            document.getElementById('dataForm').reset();
        } else {
            msgDiv.style.color = 'red';
            msgDiv.innerText = data.message;
        }
    })
    .catch(error => {
        msgDiv.style.color = 'red';
        msgDiv.innerText = 'Lỗi kết nối máy chủ!';
    });
});
</script>

</body>
</html>
