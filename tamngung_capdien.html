<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tạm ngừng cấp điện</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f7;
      color: #222;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 10px;
    }
    .title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #searchBox {
      width: 100%;
      height: 42px;
      border: 1px solid #ccc;
      border-radius: 9px;
      padding: 0 12px;
      font-size: 15px;
      outline: none;
    }
    button {
      border: 0;
      border-radius: 9px;
      height: 42px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-load { background: #1976d2; color: #fff; width: 100%; }
    .btn-photo { background: #455a64; color: #fff; width: 100%; }
    .btn-save { background: #2e7d32; color: #fff; width: 100%; }
    button:disabled { opacity: .55; cursor: not-allowed; }

    #status {
      margin-top: 7px;
      font-size: 13px;
      color: #555;
      min-height: 18px;
    }

    .list {
      padding: 10px;
      display: grid;
      gap: 10px;
    }

    .customer-box {
      background: #fff;
      border: 1px solid #dfe3e6;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      overflow: hidden;
    }
    .box-head {
      padding: 10px 12px;
      background: #fafafa;
      border-bottom: 1px solid #eee;
    }
    .ma-khang {
      font-size: 17px;
      font-weight: 800;
    }
    .ten-khang {
      margin-top: 3px;
      font-size: 15px;
      font-weight: 600;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px 12px;
      padding: 10px 12px;
    }
    .item label {
      display: block;
      color: #777;
      font-size: 11px;
      margin-bottom: 2px;
    }
    .item div {
      font-size: 13px;
      word-break: break-word;
    }

    /* Bố cục 2 cột cho Khung hình bên trái & Nút bên phải */
    .photo-actions-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0 12px 12px;
      align-items: stretch;
    }

    /* Khung hình cố định chiều cao */
    .picture-box {
      width: 100%;
      height: 140px; /* Khóa cố định chiều cao */
      border: 1px dashed #bbb;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      overflow: hidden;
      color: #999;
      font-size: 13px;
    }
    .picture-box img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Giữ nguyên tỉ lệ khung hình mà không lo làm bung khung */
    }

    /* Cột bên phải chứa các nút bấm xếp 1-2-3 */
    .actions-right {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }

    .check-wrap {
      height: 42px;
      border: 1px solid #ccc;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      background: #fff;
      padding: 0 6px;
      text-align: center;
    }
    .check-wrap input {
      width: 18px;
      height: 18px;
      margin: 0;
    }

    .empty {
      text-align: center;
      padding: 35px 10px;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="title">⚡ TẠM NGỪNG CẤP ĐIỆN</div>
    <div class="toolbar">
      <input id="searchBox" type="search" placeholder="Tìm mã KH, tên KH, số công tơ...">
      <button class="btn-load" id="btnLoad" onclick="loadCustomers()">↻ Lấy danh sách</button>
    </div>
    <div id="status">Đã tải 3 khách hàng.</div>
  </div>

  <div id="customerList" class="list">
    <!-- Mẫu khung khách hàng -->
    <div class="customer-box">
      <div class="box-head">
        <div class="ma-khang">Mã KH: PB06060048121</div>
        <div class="ten-khang">Công Ty Cổ Phần Ba Huân Long An (0909804186)</div>
      </div>
      
      <div class="grid">
        <div class="item"><label>MA_SOGCS</label><div>F3005D022</div></div>
        <div class="item"><label>DANH_SO</label><div>3B02700</div></div>
        <div class="item"><label>SO_CTO</label><div>25355650</div></div>
        <div class="item"><label>VTRI_DNOI</label><div>TT18</div></div>
        <div class="item" style="grid-column: span 2;"><label>TEN_TRAM</label><div>Công ty TNHH Ba Huân Long An (2x1500+2x1000)kVA</div></div>
      </div>

      <!-- Khung ảnh + Nút bấm xếp song song -->
      <div class="photo-actions-container">
        <!-- Khung ảnh cố định bên trái -->
        <div class="picture-box">
          <span>Chưa có hình ảnh</span>
        </div>

        <!-- Cột bên phải theo thứ tự 1-2-3 -->
        <div class="actions-right">
          <!-- 1. Checkbox Đã cắt điện -->
          <label class="check-wrap">
            <input type="checkbox"> Đã cắt điện
          </label>
          
          <!-- 2. Nút Chụp ảnh -->
          <button class="btn-photo">📷 Chụp ảnh</button>
          
          <!-- 3. Nút Lưu -->
          <button class="btn-save">💾 Lưu</button>
        </div>
      </div>
    </div>
  </div>

  <script src="tamngung_capdien.js"></script>
</body>
</html>
