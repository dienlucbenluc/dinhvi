<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tạm ngừng cấp điện</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:Arial,sans-serif; background:#eef2f5; color:#222; }
    .app-container { max-width:500px; margin:0 auto; background:#f3f5f7; min-height:100vh; box-shadow:0 0 15px rgba(0,0,0,.1); position:relative; cursor: grab; user-select: none; }
    .topbar { position:sticky; top:0; z-index:20; background:#fff; border-bottom:1px solid #ddd; padding:10px; }

    .title {
      font-size:19px;
      font-weight:700;
      margin-bottom:8px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }

    .btn-home {
      color:#000;
      height:36px;
      padding:0 10px;
      font-size:13px;
      border-radius:8px;
      white-space:nowrap;
      flex-shrink:0;
    }
    .toolbar { display:flex; flex-direction:column; gap:8px; }
    .filter-row { display:flex; gap:6px; align-items:center; }
    .input-date { flex:1; height:42px; border:1px solid #ccc; border-radius:9px; padding:0 8px; font-size:14px; outline:none; }
    .btn-search { white-space:nowrap; height:42px; }
    #searchBox { width:100%; height:42px; border:1px solid #ccc; border-radius:9px; padding:0 12px; font-size:15px; outline:none; }
    button { border:0; border-radius:9px; height:42px; padding:0 12px; font-size:14px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
    .btn-photo { background:#B0E0E6; color:#000; width:100%; }
    .btn-save { background:#E6E6FA; color:#000; width:100%; }
    .btn-cancel { background:#FFE4E1; color:#000; width:100%; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    #status { margin-top:7px; font-size:13px; color:#555; min-height:18px; }

    /* --- CẤU TRÚC KÉO NGANG (CAROUSEL) --- */
    .list {
      padding: 10px;
      display: flex !important;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .list::-webkit-scrollbar {
      display: none;
    }

    .customer-box {
      flex: 0 0 100%;
      max-width: 100%;
      scroll-snap-align: center;
      background: #fff;
      border: 2px solid #0056b3;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      overflow: hidden;
    }

    .box-stt-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #f0f4f8;
      border-bottom: 1px solid #e2e8f0;
      font-size: 13px;
    }
    .stt-badge {
      background: #e0edff;
      color: #0288d1;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .swipe-hint {
      color: #666;
      font-size: 12px;
      font-weight: 500;
    }

    .box-head { padding:10px 12px; background:#fafafa; border-bottom:1px solid #eee; }
    .ma-khang { font-size:16px; font-weight:600;color:#0056b3; }
    .ten-khang { margin-top:3px; font-size:16px; font-weight:600;color:#0056b3; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px 12px; padding:10px 12px; font-size:13px; }
    .item label { display:block; color:#777; font-size:13px; margin-bottom:2px; }
    .item div { font-size:11px;}
    .photo-actions-container { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 12px 12px; align-items:stretch; }
    .picture-box { width:100%; height:186px; border:1px dashed #bbb; border-radius:9px; display:flex; align-items:center; justify-content:center; background:#fafafa; overflow:hidden; color:#999; font-size:13px; }
    .picture-box img { width:100%; height:100%; object-fit:cover; }
    .actions-right { display:flex; flex-direction:column; justify-content:space-between; gap:6px; }
    .check-wrap { height:42px; border:1px solid #ccc; border-radius:9px; display:flex; align-items:center; justify-content:center; gap:6px; font-size:13px; font-weight:700; background:#fff; padding:0 6px; text-align:center; cursor:pointer; }
    .check-wrap input { width:18px; height:18px; margin:0; }
    .empty { text-align:center; padding:35px 10px; color:#777; width:100%; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
    }
    .modal-box {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      width: 90%; max-width: 350px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      text-align: center;
    }
    .modal-title {
      font-size: 18px; font-weight: bold; margin-bottom: 8px;
    }
    .modal-buttons {
      display: flex; gap: 10px; margin-top: 15px;
    }
    .btn-modal-cancel, .btn-modal-danger {
      flex: 1; padding: 10px; border: none; border-radius: 6px;
      font-weight: bold; cursor: pointer;
    }
    .btn-modal-cancel { background: #e0e0e0; color: #333; }
    .btn-modal-danger { background: #d32f2f; color: #fff; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="topbar">
      <div class="title">
        <span>⚡ TẠM NGỪNG CẤP ĐIỆN</span>
        <button class="btn-home" type="button" onclick="goHome()">🏠 Trang chủ</button>
      </div>
      <div class="toolbar">
        <div class="filter-row">
          <input type="date" id="filterDate" class="input-date">
          <button class="btn-search" id="btnSearch" onclick="loadCustomers()">🔍 Lấy danh sách</button>
        </div>
        <input id="searchBox" type="search" placeholder="Tìm theo Mã KH, Tên KH, Số CTơ...">
      </div>
      <div style="font-size: 14px; font-style: italic; margin-top: 8px;" id="status"></div>
    </div>
    <div id="customerList" class="list">
      <div class="empty">Đang chuẩn bị danh sách...</div>
    </div>
  </div>

  <script>
    function goHome() {
      window.top.location.href = 'home.html';
    }
  </script>
  <script src="tamngung_capdien.js?v=20260905_v2"></script>

  <!-- Modal Xác Nhận Hủy Trạng Thái -->
  <div id="cancelModal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <div class="modal-title" style="color: var(--danger-color, #d32f2f);">Xác Nhận Hủy</div>
      <p id="cancelModalMsg" style="font-size: 14px; color: var(--text-sub, #555); text-align: center; margin: 12px 0;">
        Bạn có chắc chắn muốn hủy trạng thái và xóa hình ảnh của khách hàng này?
      </p>
      <div class="modal-buttons">
        <button class="btn-modal-cancel" onclick="closeCancelModal()">Hủy</button>
        <button class="btn-modal-danger" id="btnConfirmCancel">Đồng ý</button>
      </div>
    </div>
  </div>
</body>
</html>
