<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Đăng nhập - Định vị công tơ</title>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; font-family: Arial, sans-serif; background: #f4f4f9; color: #333; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #fff; border-radius: 12px; padding: 24px; width: 90%; max-width: 380px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); text-align: center; }
        .logo { width: 60px; height: 60px; object-fit: contain; margin-bottom: 10px; mix-blend-mode: multiply; }
        .title { font-size: 18px; font-weight: bold; color: #1E90FF; margin-bottom: 4px; }
        .subtitle { font-size: 13px; color: #666; margin-bottom: 20px; }
        .form-group { text-align: left; margin-bottom: 14px; }
        label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; color: #444; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 15px; outline: none; }
        input:focus { border-color: #007bff; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:disabled { background: #aaa; }
        #msg { margin-top: 12px; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="LOGO.png" alt="Logo" class="logo">
        <div class="title">Định vị công tơ Bến Lức</div>
        <div class="subtitle">Vui lòng đăng nhập hệ thống</div>

        <div class="form-group">
            <label for="username">Tên người dùng (ten_ndung):</label>
            <input type="text" id="username" placeholder="Nhập tên người dùng...">
        </div>

        <div class="form-group">
            <label for="password">Mật khẩu:</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu...">
        </div>

        <button id="btnLogin" onclick="handleLogin()">Đăng nhập</button>
        <div id="msg"></div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycby_pM4151Q4xksPdnJkFflE3TNVJEO1R-WKuewTwukJZ-8fee26sBH-eHE8pl5EQMLSEQ/exec";

        // Nếu đã đăng nhập trước đó thì chuyển hướng thẳng qua index.html
        document.addEventListener("DOMContentLoaded", () => {
            const userSession = localStorage.getItem("cmis_user_session");
            if (userSession) {
                window.location.href = "index.html";
            }
        });

        function handleLogin() {
            const ten_ndung = document.getElementById("username").value.trim();
            const mat_khau = document.getElementById("password").value.trim();
            const msgEl = document.getElementById("msg");
            const btn = document.getElementById("btnLogin");

            if (!ten_ndung || !mat_khau) {
                msgEl.style.color = "#dc3545";
                msgEl.innerText = "Vui lòng nhập đầy đủ Tên người dùng và Mật khẩu!";
                return;
            }

            msgEl.style.color = "#007bff";
            msgEl.innerText = "Đang kiểm tra đăng nhập...";
            btn.disabled = true;

            fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                redirect: "follow",
                body: JSON.stringify({ action: "LOGIN", ten_ndung: ten_ndung, mat_khau: mat_khau })
            })
            .then(res => res.text())
            .then(text => JSON.parse(text))
            .then(res => {
                btn.disabled = false;
                if (res.status === "success") {
                    msgEl.style.color = "#28a745";
                    msgEl.innerText = "Đăng nhập thành công! Đang chuyển trang...";
                    
                    // Lưu thông tin phiên đăng nhập
                    const sessionData = {
                        ten_ndung: res.ten_ndung,
                        ten_nvien: res.ten_nvien,
                        mat_khau: mat_khau
                    };
                    localStorage.setItem("cmis_user_session", JSON.stringify(sessionData));

                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 500);
                } else {
                    msgEl.style.color = "#dc3545";
                    msgEl.innerText = "Lỗi: " + res.message;
                }
            })
            .catch(err => {
                btn.disabled = false;
                msgEl.style.color = "#dc3545";
                msgEl.innerText = "Lỗi kết nối máy chủ!";
                console.error(err);
            });
        }
    </script>
</body>
</html>
