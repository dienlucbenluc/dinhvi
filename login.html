<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Điện lực Bến Lức - Định vị công tơ</title>
    <style>
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            font-family: Arial, sans-serif; 
            background: #f4f4f9; 
            color: #333; 
        }

        /* Container chính */
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
            box-sizing: border-box;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            padding: 12px 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 16px;
            position: relative;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
            mix-blend-mode: multiply;
        }
        .header-title {
            font-size: 15px;
            font-weight: bold;
            color: #1E90FF;
        }
        .user-name {
            font-size: 13px;
            color: #28a745;
            font-weight: bold;
            margin-top: 2px;
        }
        .menu-btn {
            background: #007bff;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Menu thả xuống */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 60px;
            right: 16px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            width: 160px;
            z-index: 100;
            overflow: hidden;
        }
        .dropdown-menu.show {
            display: block;
        }
        .dropdown-item {
            padding: 12px 16px;
            font-size: 14px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
        }
        .dropdown-item:last-child {
            border-bottom: none;
        }
        .dropdown-item:active {
            background: #f8f9fa;
        }
        .dropdown-item.text-danger {
            color: #dc3545;
        }

        /* Form & Nút thao tác */
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 16px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }
        button.btn-primary {
            width: 100%;
            padding: 12px;
            background: #1e7e34;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        /* CSS Popup Xác Nhận Thoát Chuyên Nghiệp */
        .custom-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            align-items: center; 
            justify-content: center;
            z-index: 9999;
        }
        .modal-content {
            background: #ffffff;
            width: 85%;
            max-width: 320px;
            padding: 24px 20px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            animation: popupScale 0.2s ease-out;
        }
        @keyframes popupScale {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-icon {
            width: 48px;
            height: 48px;
            background: #fff3cd;
            color: #856404;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 12px;
        }
        .modal-title { 
            font-weight: bold; 
            font-size: 17px; 
            color: #212529; 
            margin-bottom: 8px; 
        }
        .modal-body { 
            font-size: 14px; 
            color: #6c757d; 
            margin-bottom: 20px; 
            line-height: 1.4; 
        }
        .modal-actions { 
            display: flex; 
            gap: 10px; 
        }
        .modal-actions button {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-cancel { 
            background: #e9ecef; 
            color: #495057; 
        }
        .btn-confirm { 
            background: #dc3545; 
            color: #ffffff; 
        }
        .btn-cancel:active { background: #dee2e6; }
        .btn-confirm:active { background: #bd2130; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <img src="LOGO.png" alt="Logo" class="logo">
                <div>
                    <div class="header-title">Điện lực Bến Lức - Định vị công tơ</div>
                    <div class="user-name" id="dispUserName">👤 Đang tải...</div>
                </div>
            </div>
            <button class="menu-btn" onclick="toggleMenu()">☰</button>

            <!-- Dropdown Menu -->
            <div class="dropdown-menu" id="dropdownMenu">
                <div class="dropdown-item" onclick="handleChangePassword()">
                    🔑 Đổi mật khẩu
                </div>
                <div class="dropdown-item text-danger" onclick="openLogoutModal()">
                    🚪 Thoát
                </div>
            </div>
        </div>

        <!-- Form nhập thông tin -->
        <div class="card">
            <div class="form-group">
                <input type="text" id="maKh" placeholder="Mã KH (VD: PB060600...)">
            </div>
            <div class="form-group">
                <input type="text" id="dieuTraTram" placeholder="Điều tra trạm">
            </div>
            <div class="form-group">
                <textarea id="ghiChu" rows="2" placeholder="Nhập ghi chú thêm nếu có..."></textarea>
            </div>
            <button class="btn-primary" onclick="getLocation()">Lấy tọa độ vị trí treo công tơ</button>
        </div>
    </div>

    <!-- POPUP XÁC NHẬN THOÁT TÙY CHỈNH (MỚI) -->
    <div id="logoutModal" class="custom-modal">
        <div class="modal-content">
            <div class="modal-icon">⚠️</div>
            <div class="modal-title">Xác nhận thoát</div>
            <div class="modal-body">Bạn có chắc chắn muốn thoát khỏi hệ thống đăng nhập?</div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeLogoutModal()">Hủy</button>
                <button class="btn-confirm" onclick="confirmLogout()">Thoát</button>
            </div>
        </div>
    </div>

    <script>
        // Kiểm tra phiên đăng nhập khi load trang
        document.addEventListener("DOMContentLoaded", () => {
            const userSession = localStorage.getItem("cmis_user_session");
            if (!userSession) {
                window.location.href = "login.html";
                return;
            }
            const data = JSON.parse(userSession);
            document.getElementById("dispUserName").innerText = "👤 " + (data.ten_nvien || data.ten_ndung);
        });

        // Bật/tắt Menu góc phải
        function toggleMenu() {
            const menu = document.getElementById("dropdownMenu");
            menu.classList.toggle("show");
        }

        // Đóng menu khi bấm ra ngoài
        window.onclick = function(event) {
            if (!event.target.matches('.menu-btn')) {
                const dropdowns = document.getElementsByClassName("dropdown-menu");
                for (let i = 0; i < dropdowns.length; i++) {
                    let openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }

        // Đổi mật khẩu
        function handleChangePassword() {
            alert("Chức năng đổi mật khẩu đang cập nhật!");
        }

        // Mở Popup thoát
        function openLogoutModal() {
            document.getElementById("logoutModal").style.display = "flex";
        }

        // Đóng Popup thoát
        function closeLogoutModal() {
            document.getElementById("logoutModal").style.display = "none";
        }

        // Xử lý thoát đăng nhập
        function confirmLogout() {
            localStorage.removeItem("cmis_user_session");
            window.location.href = "login.html";
        }

        // Giả lập hàm lấy tọa độ
        function getLocation() {
            alert("Đang định vị...");
        }
    </script>
</body>
</html>
